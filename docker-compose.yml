version: "3.9"
services:
  api:
    build: ./api
    ports: ["8000:8000"]
    volumes:
      - ./ml:/app/ml:ro
      - ./data:/app/data
    env_file: .env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/docs"]
      interval: 10s
      timeout: 5s
      retries: 5
  dashboard:
    build: ./dashboard
    ports: ["5173:80"]
    depends_on:
      api:
        condition: service_healthy
